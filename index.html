<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK ENERGY AI - All Buttons Work</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{font-family:Inter,sans-serif} .y{background:#FFEB00} .mono{font-family:monospace} .active{background:#FFEB00;color:#000;font-weight:700}</style>
</head>
<body class="bg-black text-white h-screen flex overflow-hidden">

<aside class="w-[260px] bg-[#111] border-r border-white/10 flex flex-col p-3">
<div class="flex items-center gap-2 p-2 mb-2"><div class="w-7 h-7 y rounded text-black flex items-center justify-center">⚡</div><b class="text-[13px]">BLACK ENERGY AI</b></div>

<button onclick="doNew()" class="y w-full py-2.5 rounded-xl text-[13px] font-bold mb-3"><i class="fa-solid fa-plus"></i> New chat</button>

<div class="relative mb-3"><i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[10px] opacity-40"></i><input id="searchIn" oninput="doSearch(this.value)" placeholder="Search chats" class="w-full bg-[#1a1a1a] border border-white/10 rounded-xl py-2 pl-8 pr-3 text-[12px] outline-none"></div>

<div class="flex flex-col gap-1 text-[13px]">
<button id="btn-lib" onclick="doLib()" class="flex gap-3 px-3 py-2 rounded-xl hover:bg-white/10 text-left"><i class="fa-solid fa-images w-4"></i> Library</button>
<button id="btn-sora" onclick="doSora()" class="flex gap-3 px-3 py-2 rounded-xl hover:bg-white/10 text-left"><i class="fa-solid fa-film w-4"></i> Sora - Video</button>
<button id="btn-gpts" onclick="doGpts()" class="flex gap-3 px-3 py-2 rounded-xl hover:bg-white/10 text-left"><i class="fa-solid fa-robot w-4"></i> GPTs</button>
<button id="btn-hist" onclick="doHist()" class="flex gap-3 px-3 py-2 rounded-xl hover:bg-white/10 text-left active"><i class="fa-solid fa-clock w-4"></i> History</button>
</div>

<div id="historyList" class="mt-3 flex flex-col gap-1 text-[12px] max-h-[200px] overflow-auto"></div>

<div class="mt-auto border-t border-white/10 pt-3">
<div class="flex gap-2 text-[10px]"><button onclick="doShare()" class="flex-1 bg-[#1a1a1a] py-2 rounded-lg"><i class="fa-solid fa-share"></i> Share</button><button onclick="doSettings()" class="flex-1 bg-[#1a1a1a] py-2 rounded-lg"><i class="fa-solid fa-gear"></i> Settings</button></div>
<div class="mt-2 flex items-center gap-2"><div class="w-6 h-6 y rounded-full"></div><span class="text-[11px]">Energy Core 98.7%</span><button onclick="doLogout()" class="ml-auto text-[10px] opacity-50"><i class="fa-solid fa-right-from-bracket"></i></button></div>
</div>
</aside>

<main class="flex-1 flex flex-col">
<header class="h-14 flex items-center justify-between px-4 border-b border-white/10">
<div class="flex gap-2"><button onclick="doModel('BEA-4')" id="modelBtn" class="px-3 py-1.5 bg-[#1a1a1a] rounded-xl text-[13px]">BEA-4 Turbo <i class="fa-solid fa-chevron-down text-[10px]"></i></button><span id="status" class="text-[10px] bg-yellow-400/10 text-yellow-400 px-2 py-1 rounded-full border border-yellow-400/20">Online</span></div>
<div class="flex gap-2"><button onclick="doCopyChat()" class="w-8 h-8 bg-[#1a1a1a] rounded-xl"><i class="fa-regular fa-copy text-[12px]"></i></button><button onclick="doDelete()" class="w-8 h-8 bg-[#1a1a1a] rounded-xl text-red-400"><i class="fa-regular fa-trash-can text-[12px]"></i></button></div>
</header>

<div id="mainArea" class="flex-1 overflow-auto p-6 flex flex-col items-center">
<div id="welcome" class="text-center mt-10">
<div class="w-16 h-16 y rounded-2xl flex items-center justify-center text-black text-[28px] mx-auto mb-4 shadow-[0_0_30px_#FFEB00]">⚡</div>
<h1 class="text-[24px] font-bold">BLACK ENERGY AI</h1>
<p id="welcomeText" class="text-[12px] opacity-50 mt-2">How can I help today?</p>
<div class="grid grid-cols-2 gap-3 mt-8 max-w-[560px]">
<button onclick="usePrompt('Cyberpunk city with yellow lightning')" class="p-3 rounded-xl bg-[#1a1a1a] border border-white/10 text-left text-[12px]">🏙️ Cyberpunk City</button>
<button onclick="usePrompt('Giant mech robot with energy core')" class="p-3 rounded-xl bg-[#1a1a1a] border border-white/10 text-left text-[12px]">🤖 Mech Concept</button>
<button onclick="usePrompt('Abstract energy art yellow on black')" class="p-3 rounded-xl bg-[#1a1a1a] border border-white/10 text-left text-[12px]">🎨 Energy Art</button>
<button onclick="usePrompt('Tokyo map cyberpunk style')" class="p-3 rounded-xl bg-[#1a1a1a] border border-white/10 text-left text-[12px]">🗺️ Location Map</button>
</div>
</div>
<div id="chatList" class="w-full max-w-[700px] flex flex-col gap-4"></div>
</div>

<div class="p-4">
<div class="max-w-[700px] mx-auto bg-[#1e1e1e] border border-white/15 rounded-[24px] p-2">
<div class="flex gap-2 items-end">
<button onclick="doAttach()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-paperclip text-[12px]"></i></button>
<textarea id="msg" rows="1" placeholder="Ask anything..." class="flex-1 bg-transparent outline-none text-[14px] py-2 resize-none"></textarea>
<button onclick="doVoice()" id="voiceBtn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-microphone text-[12px]"></i></button>
<button onclick="doSend()" class="w-8 h-8 y rounded-full flex items-center justify-center text-black"><i class="fa-solid fa-arrow-up"></i></button>
</div>
<div class="flex gap-2 px-2 pt-2">
<button id="toolsBtn" onclick="doTools()" class="px-3 py-1 rounded-full bg-white/10 text-[10px]"><i class="fa-solid fa-wand-magic-sparkles"></i> Tools</button>
<button id="searchBtn" onclick="doWebSearch()" class="px-3 py-1 rounded-full bg-white/5 text-[10px]">🌐 Web Search</button>
<button id="reasonBtn" onclick="doReason()" class="px-3 py-1 rounded-full bg-white/5 text-[10px]">💡 Reason</button>
<button onclick="doUpgrade()" class="ml-auto px-3 py-1 rounded-full y text-black text-[10px] font-bold">Upgrade to Pro</button>
</div>
</div>
</div>
</main>

<!-- Modals -->
<div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur hidden items-center justify-center z-50"><div class="bg-[#1a1a1a] border border-white/10 rounded-2xl p-6 w-[400px]"><h3 id="modalTitle" class="font-bold mb-2"></h3><p id="modalText" class="text-[13px] opacity-70"></p><button onclick="closeModal()" class="mt-4 y w-full py-2 rounded-xl text-black font-bold">Close</button></div></div>

<script>
let chats=JSON.parse(localStorage.getItem('beai_chats')||'[]');
let currentModel='BEA-4 Turbo';
function save(){localStorage.setItem('beai_chats',JSON.stringify(chats));renderHist()}
function renderHist(){document.getElementById('historyList').innerHTML=chats.map((c,i)=>'<div onclick=\"loadChat('+i+')\" class=\"px-3 py-2 rounded-xl hover:bg-white/10 cursor-pointer flex justify-between\"><span class=\"truncate\">'+c.title.slice(0,22)+'</span><i onclick=\"delChat('+i+');event.stopPropagation()\" class=\"fa-solid fa-xmark opacity-30 hover:opacity-100\"></i></div>').join('')}
renderHist();
function doNew(){document.getElementById('chatList').innerHTML='';document.getElementById('welcome').style.display='block';document.getElementById('msg').value=''}
function doSearch(v){let f=chats.filter(c=>c.title.toLowerCase().includes(v.toLowerCase()));document.getElementById('historyList').innerHTML=f.map((c,i)=>'<div class=\"px-3 py-2 rounded-xl bg-white/5\">'+c.title+'</div>').join('');if(!v)renderHist()}
function doLib(){showModal('Library','Your 53,901 creations saved here. Images, videos, concepts.');setActive('btn-lib')}
function doSora(){showModal('Sora - Video Generator','Generate videos with BEA-4. Type: \"a city timelapse with lightning\"');setActive('btn-sora')}
function doGpts(){showModal('GPTs Store','Custom GPTs: Cyberpunk Builder, Mech Designer, Energy Artist');setActive('btn-gpts')}
function doHist(){setActive('btn-hist');renderHist()}
function setActive(id){document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active')}
function doShare(){showModal('Share Chat','Link copied: blackenergy.ai/share/'+Date.now());navigator.clipboard.writeText(location.href)}
function doSettings(){showModal('Settings','Theme: Dark, Language: English, Energy Core: 98.7% Stable, Model: '+currentModel)}
function doLogout(){if(confirm('Logout?')){localStorage.clear();location.reload()}}
function doModel(m){currentModel=m=='BEA-4'?'BEA-4 Turbo':'BEA-4 Fast';document.getElementById('modelBtn').innerText=currentModel+' ▼';showModal('Model Switched','Now using '+currentModel)}
function doCopyChat(){let t=document.getElementById('chatList').innerText;navigator.clipboard.writeText(t);showModal('Copied','Chat copied to clipboard')}
function doDelete(){if(confirm('Delete all chats?')){document.getElementById('chatList').innerHTML='';document.getElementById('welcome').style.display='block'}}
function doAttach(){showModal('Attach','Upload image, PDF, or file. (Premium feature)');}
function doVoice(){let b=document.getElementById('voiceBtn');b.classList.toggle('y');b.classList.toggle('text-black');if(b.classList.contains('y')){showModal('Voice Mode','Listening... Speak now');setTimeout(()=>{document.getElementById('msg').value='Cyberpunk city with lightning';b.classList.remove('y','text-black')},2000)}}
function doTools(){document.getElementById('toolsBtn').classList.toggle('y');showModal('Tools','Image Gen, Video Gen, Code, Map, Search enabled')}
function doWebSearch(){let b=document.getElementById('searchBtn');b.classList.toggle('y');b.classList.toggle('text-black');showModal('Web Search '+(b.classList.contains('y')?'ON':'OFF'),'Searching web for energy concepts')}
function doReason(){let b=document.getElementById('reasonBtn');b.classList.toggle('y');showModal('Reason Mode','Deep reasoning enabled - will analyze step by step')}
function doUpgrade(){showModal('Upgrade to Pro','₹999/month - Unlimited images, 4K, Sora video, No watermark')}
function usePrompt(t){document.getElementById('msg').value=t;document.getElementById('msg').focus()}
function doSend(){
let txt=document.getElementById('msg').value.trim();if(!txt)return;
document.getElementById('welcome').style.display='none';
let list=document.getElementById('chatList');
let u=document.createElement('div');u.className='flex justify-end';u.innerHTML='<div class=\"bg-[#FFEB00] text-black px-4 py-2 rounded-2xl max-w-[70%] text-[14px]\">'+txt+'</div>';list.appendChild(u);
let a=document.createElement('div');a.className='flex gap-3';a.innerHTML='<div class=\"w-7 h-7 y rounded-lg shrink-0 flex items-center justify-center text-black\">⚡</div><div class=\"flex-1 bg-[#1a1a1a] border border-white/10 rounded-2xl p-3\"><img class=\"rounded-xl w-full\" src=\"https://image.pollinations.ai/prompt/'+encodeURIComponent(txt.slice(0,80))+'?width=700&height=400&seed='+Date.now()+'\"><div class=\"flex gap-2 mt-2\"><button onclick=\"navigator.clipboard.writeText(this.parentElement.previousElementSibling.src)\" class=\"px-2 py-1 bg-white/10 rounded-full text-[10px]\"><i class=\"fa-regular fa-copy\"></i> Copy</button><button onclick=\"this.closest(\'div\').querySelector(\'img\').src=this.closest(\'div\').querySelector(\'img\').src+\'&r=\'+Date.now()\" class=\"px-2 py-1 bg-white/10 rounded-full text-[10px]\">🔄 Regenerate</button><button onclick=\"window.open(this.parentElement.previousElementSibling.src)\" class=\"px-2 py-1 bg-[#FFEB00]/20 text-[#FFEB00] rounded-full text-[10px]\">⬇ Download</button></div></div>';list.appendChild(a);
chats.unshift({title:txt,date:Date.now()});save();
document.getElementById('msg').value='';list.scrollTop=list.scrollHeight;
}
function loadChat(i){document.getElementById('msg').value=chats[i].title;doSend()}
function delChat(i){chats.splice(i,1);save()}
function showModal(t,msg){document.getElementById('modalTitle').innerText=t;document.getElementById('modalText').innerText=msg;document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
document.getElementById('msg').addEventListener('input',function(){this.style.height='auto';this.style.height=this.scrollHeight+'px'});
</script>
</body>
</html>
