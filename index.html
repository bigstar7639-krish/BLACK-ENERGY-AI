<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=JetBrains+Mono:wght@700&display=swap');*{font-family:'Space Grotesk',sans-serif}.mono{font-family:'JetBrains Mono',monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{box-shadow:0 0 20px #ffeb00}50%{box-shadow:0 0 40px #ffeb00,0 0 60px #ff6b00}}@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.float{animation:float 3s ease-in-out infinite}.energy-orb{animation:pulse 2.5s infinite}.scan::after{content:'';position:absolute;top:0;left:0;width:50%;height:2px;background:linear-gradient(90deg,transparent,#ffeb00,transparent);animation:scan 2s linear infinite}
.cursor-dot{width:8px;height:8px;background:#ffeb00;border-radius:50%;position:fixed;pointer-events:none;z-index:9999;box-shadow:0 0 10px #ffeb00}.cursor-ring{width:28px;height:28px;border:1px solid rgba(255,235,0,.4);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transition:transform .15s ease-out}
/* MOBILE FIXES */
@media(max-width:768px){.cursor-dot,.cursor-ring{display:none!important}*{cursor:auto!important} .hide-mobile{display:none!important}}
@media(min-width:769px){*{cursor:none}}
.particle{position:fixed;width:2px;height:2px;background:#ffeb00;pointer-events:none;opacity:.5;border-radius:50%}
input,textarea{font-size:16px!important} /* FIX iPhone zoom bug */
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
</style>
